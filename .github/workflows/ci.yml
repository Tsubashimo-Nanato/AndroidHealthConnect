name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android:
    name: Android test and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test and compile debug Kotlin
        working-directory: AndroidClient
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin

  server:
    name: Server build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build server
        working-directory: Server
        run: dotnet build HC_server.sln --configuration Release
      - name: Test server
        working-directory: Server
        run: dotnet test HC_server.sln --configuration Release --no-build
