<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Health Connect Graph</title>
    <link rel="stylesheet" href="/assets/health-graph.css" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="/assets/health-graph.js" defer></script>
</head>
<body class="health-graph-page">
    <main class="health-graph-shell">
        <header class="health-graph-header">
            <h1>Health Connect Graph</h1>
            <p>Inspect uploaded sample data by metric and local date.</p>
        </header>

        <section class="health-graph-controls" aria-label="Graph query controls">
            <div class="health-graph-field">
                <label for="metric">Metric</label>
                <select id="metric">
                    <option value="heart_rate">heart_rate</option>
                    <option value="steps">steps</option>
                    <option value="calories">calories</option>
                    <option value="sleep_stage">sleep_stage</option>
                </select>
            </div>

            <div class="health-graph-field">
                <label for="date">Date</label>
                <input id="date" type="date" />
            </div>

            <button id="showGraph" type="button">Show</button>
        </section>

        <section class="health-graph-controls" aria-label="API key controls">
            <div class="health-graph-field health-graph-key">
                <label for="apiKey">API Key</label>
                <input id="apiKey" type="password" autocomplete="off" placeholder="X-API-Key" />
            </div>
            <button id="saveKey" type="button">Use for session</button>
            <button id="clearKey" type="button">Clear</button>
            <p id="keyStatus" class="health-graph-status" aria-live="polite"></p>
        </section>

        <p id="queryStatus" class="health-graph-status" aria-live="polite">Choose a date and show data.</p>
        <div id="plot" class="health-graph-plot" role="img" aria-label="Health metric graph"></div>
    </main>
</body>
</html>
